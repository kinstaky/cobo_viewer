[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"
[project]
name = "cobo-viewer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn"]
[project.scripts]
cobo-viewer = "cobo_viewer.server:main"
[tool.scikit-build]
wheel.packages = ["src/cobo_viewer"]
[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff>=0.17.6",
    "clang-format>=23.1.5",
    "cmakelang>=0.6.13",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
